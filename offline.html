<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1">

<title>Offline</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#000;

font-family:Inter,sans-serif;

display:flex;

justify-content:center;
align-items:center;

height:100vh;

padding:24px;

}

.card{

width:min(360px,100%);

background:#fff;

border-radius:28px;

padding:32px;

text-align:center;

box-shadow:
0 30px 80px rgba(0,0,0,.35);

}

h1{

font-family:
"Cormorant Garamond",serif;

font-size:34px;

margin-bottom:14px;

color:#1f1f1f;

}

p{

font-size:15px;

line-height:1.8;

color:#666;

margin-bottom:28px;

}

.buttons{

display:flex;

gap:12px;

}

button{

flex:1;

height:52px;

border:none;

border-radius:999px;

font-size:15px;

font-weight:600;

cursor:pointer;

}

.gold{

background:
linear-gradient(
135deg,
#B78A4A,
#D8B98C
);

color:white;

}

.white{

background:white;

color:#222;

border:1px solid #ddd;

}

</style>

</head>

<body>

<div class="card">

<h1>

You're Offline

</h1>

<p>

Only your downloaded practices are available while you're offline.

</p>

<div class="buttons">

<button
class="gold"
onclick="location.href='/app-library'">

Open Library

</button>

<button
class="white"
onclick="history.back()">

Close

</button>

</div>

</div>

</body>

</html>
